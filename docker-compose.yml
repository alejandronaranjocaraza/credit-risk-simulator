services:
  database:
    image: postgres
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - data_sql:/var/lib/postgresql
      - ./data:/docker-entrypoint-initdb.d

volumes:
  data_sql:
